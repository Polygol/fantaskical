<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../lang.js">
        // --- Internationalization (i18n) Support ---
        function getAppLanguage() {
            let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
            if (l === 'JA') l = 'JP';
            return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
        }

        function t(key, params = {}) {
            const lang = getAppLanguage();
            const dict = window['LANG_' + lang + '_FANTASKICAL'] || window['LANG_EN_FANTASKICAL'] || {};
            let str = dict[key] || key;
            Object.keys(params).forEach(p => {
                str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]);
            });
            return str;
        }

        function applyLanguage(langCode) {
            if (langCode) localStorage.setItem('language', langCode);
            const lang = getAppLanguage();
            const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
            document.documentElement.lang = bcpMap[lang] || 'en-US';
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const k = el.getAttribute('data-lang-key');
                if (k) {
                    if (el.tagName === 'TITLE') {
                        document.title = t(k);
                    } else {
                        el.textContent = t(k);
                    }
                }
            });
            document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
                const k = el.getAttribute('data-lang-placeholder');
                if (k) el.placeholder = t(k);
            });
            document.querySelectorAll('[data-lang-title]').forEach(el => {
                const k = el.getAttribute('data-lang-title');
                if (k) el.title = t(k);
            });
            if (typeof onLanguageChanged === 'function') {
                onLanguageChanged(lang);
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
                applyLanguage(e.data.languageCode);
            }
        });

        window.addEventListener('DOMContentLoaded', () => applyLanguage());
        

    </script>
    <title>Date Widget</title>
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js"></script>
    <style>
        :root { --text-color: #f9f9f9; }
        body.light-theme { --text-color: #333333; }
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .date-container {
            display: flex;
            gap: 15vh;
            flex-direction: column;
            line-height: 1;
        }
        .weekday {
            font-size: 22px;
            font-weight: 500;
            text-transform: uppercase;
        }
        .day {
            font-size: 120px;
            font-weight: bold;
            font-family: 'Inter Numeric', 'Inter';
            font-feature-settings: "RDNS" 1;
            line-height: 0.8;
        }
    </style>
</head>
<body>
    <div class="date-container">
        <div class="weekday" id="weekday"></div>
        <div class="day" id="day"></div>
    </div>
    <script>
        const weekdayEl = document.getElementById('weekday');
        const dayEl = document.getElementById('day');
        let displayedDay = null;
    
        function updateDate() {
            const today = new Date();
            const currentDay = today.getDate();
            
            // Only update the DOM if the day has actually changed
            if (currentDay !== displayedDay) {
                weekdayEl.textContent = today.toLocaleDateString((function(){ const l = (localStorage.getItem('language') || 'EN').toUpperCase(); const m = {EN:'en-US',JP:'ja-JP',KO:'ko-KR',ZH:'zh-CN'}; return m[l==='JA'?'JP':l]||'en-US'; })(), { weekday: 'long' });
                dayEl.textContent = currentDay;
                displayedDay = currentDay;
            }
        }
    
        // Run the check every minute to catch the change at midnight
        setInterval(updateDate, 60000);
    
        // Initial render
        updateDate();
    </script>
    </body>
</html>
