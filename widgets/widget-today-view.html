<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../lang.js"></script>
    <script>
        const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
        window.bcpMap = bcpMap;

        function getAppLanguage() {
            let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
            if (l === 'JA') l = 'JP';
            return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
        }

        function t(key, params = {}) {
            const lang = getAppLanguage();
            const dict = window['LANG_' + lang + '_FANTASKICAL'] || window['LANG_EN_FANTASKICAL'] || {};
            let str = dict[key] || key;
            Object.keys(params).forEach(p => str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]));
            return str;
        }
        window.t = t;
        window.getAppLanguage = getAppLanguage;

        function applyLanguage(langCode) {
            if (langCode) localStorage.setItem('language', langCode);
            const lang = getAppLanguage();
            const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
            document.documentElement.lang = bcpMap[lang] || 'en-US';
            if (typeof updateTodaysEvents === 'function') updateTodaysEvents();
        }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
                applyLanguage(e.data.languageCode);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'language' || e.key === 'selectedLanguage') {
                applyLanguage(e.newValue);
            }
        });

        window.addEventListener('DOMContentLoaded', () => applyLanguage());
    </script>
    <title data-lang-key="TODAYS_EVENTS">Today's Events</title>
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js"></script>
    <style>
        :root {
            --text-color: #f9f9f9;
            --secondary-text-color: rgba(255, 255, 255, 0.7);
        }
        body.light-theme {
            --text-color: #333333;
            --secondary-text-color: rgba(0, 0, 0, 0.7);
        }
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .widget-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .events-list {
            flex-grow: 1;
            font-size: 14px;
        }
        .event-item {
            display: flex;
            margin-bottom: 4px;
        }
        .event-time {
            color: var(--secondary-text-color);
            width: 70px;
            flex-shrink: 0;
        }
        .event-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .no-events {
            color: var(--secondary-text-color);
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="header" id="widgetHeader"></div>
        <div class="events-list" id="eventsList"></div>
    </div>
    <script>
        let updateTodaysEvents;
        document.addEventListener('DOMContentLoaded', () => {
            const eventsList = document.getElementById('eventsList');
            const widgetHeader = document.getElementById('widgetHeader');
    
            updateTodaysEvents = function() {
                try {
                    const today = new Date();
                    const lang = getAppLanguage();
                    const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
                    const locale = bcpMap[lang] || 'en-US';
                    
                    widgetHeader.textContent = today.toLocaleDateString(locale, {
                        weekday: 'short',
                        day: 'numeric',
                        month: 'short'
                    });
    
                    const events = JSON.parse(localStorage.getItem('events')) || [];
    
                    function formatTime(timeStr) {
                        if (!timeStr) return t('ALL_DAY');
                        const [hours, minutes] = timeStr.split(':');
                        const date = new Date();
                        date.setHours(parseInt(hours), parseInt(minutes));
                        return date.toLocaleTimeString(locale, { hour: 'numeric', minute: '2-digit' });
                    }
    
                    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    
                    const todaysEvents = events
                        .filter(event => event.date === todayStr)
                        .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
    
                    if (todaysEvents.length === 0) {
                        eventsList.innerHTML = `<div class="no-events">${t('NO_EVENTS_SCHEDULED')}</div>`;
                    } else {
                        eventsList.innerHTML = todaysEvents.map(event => `
                            <div class="event-item">
                                <div class="event-time">${formatTime(event.startTime)}</div>
                                <div class="event-title">${event.title}</div>
                            </div>
                        `).join('');
                    }
                } catch (e) {
                    eventsList.innerHTML = `<div class="no-events">${t('LOADING')}</div>`;
                }
            };
    
            window.addEventListener('storage', (event) => {
                if (event.key === 'events') updateTodaysEvents();
                if (event.key === 'theme') document.body.classList.toggle('light-theme', event.newValue === 'light');
            });
    
            updateTodaysEvents();
        });
    </script>
</body>
</html>
