<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../lang.js"></script>
    <script>
        function getAppLanguage() {
            let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
            if (l === 'JA') l = 'JP';
            return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
        }

        function t(key, params = {}) {
            const lang = getAppLanguage();
            const dict = window['LANG_' + lang + '_FANTASKICAL'] || window['LANG_EN_FANTASKICAL'] || {};
            let str = dict[key] || key;
            Object.keys(params).forEach(p => str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]));
            return str;
        }

        function applyLanguage(langCode) {
            if (langCode) localStorage.setItem('language', langCode);
            const lang = getAppLanguage();
            const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
            document.documentElement.lang = bcpMap[lang] || 'en-US';
            if (typeof renderMonth === 'function') renderMonth();
        }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
                applyLanguage(e.data.languageCode);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'language' || e.key === 'selectedLanguage') {
                applyLanguage(e.newValue);
            }
        });

        window.addEventListener('DOMContentLoaded', () => applyLanguage());
    </script>
    <title>Month View</title>
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js"></script>
    <style>
        :root {
            --text-color: #f9f9f9;
            --secondary-text-color: rgba(255, 255, 255, 0.7);
            --search-background-dark: rgba(51, 51, 51, 0.5);
            --search-background-light: rgba(220, 220, 220, 0.5);
            --search-background: var(--search-background-dark);
        }
        body.light-theme {
            --text-color: #333333;
            --secondary-text-color: rgba(0, 0, 0, 0.7);
            --search-background: var(--search-background-light);
        }
        body {
            background: transparent; font-family: 'Inter', sans-serif;
            color: var(--text-color); margin: 0; padding: 10px;
        }
        .calendar-container {
            display: flex; flex-direction: column; height: 90vh;
        }
        .month-display {
            text-align: center; font-weight: bold; font-size: 14px;
            margin-bottom: 5px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px; flex-grow: 1;
        }
        .grid-cell {
            display: flex; justify-content: center; align-items: center;
            font-size: 10px; position: relative;
        }
        .weekday { color: var(--secondary-text-color); }
        .calendar-day {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50px;
        }
        .other-month { opacity: 0.4; }
        .current-day { background-color: var(--accent); }
        .has-events::after {
            content: ''; position: absolute; bottom: 1px;
            width: 3px; height: 3px; border-radius: 50px;
            background-color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="month-display" id="monthDisplay"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <script>
    let renderMonth;
    document.addEventListener('DOMContentLoaded', () => {
        const monthDisplay = document.getElementById('monthDisplay');
        const calendarGrid = document.getElementById('calendarGrid');
        const currentDate = new Date();
    
        renderMonth = function() {
            try {
                const events = JSON.parse(localStorage.getItem('events')) || [];
    
                function hasEvents(year, month, day) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    return events.some(event => event.date === dateStr);
                }
    
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const today = new Date();
                const lang = getAppLanguage();
                const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
                const locale = bcpMap[lang] || 'en-US';
    
                monthDisplay.textContent = currentDate.toLocaleDateString(locale, { month: 'long', year: 'numeric' });
                
                const weekHeaders = {
                    EN: ['S', 'M', 'T', 'W', 'T', 'F', 'S'],
                    JP: ['日', '月', '火', '水', '木', '金', '土'],
                    KO: ['일', '월', '화', '수', '목', '금', '토'],
                    ZH: ['日', '一', '二', '三', '四', '五', '六']
                }[lang] || ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
                
                calendarGrid.innerHTML = weekHeaders.map(d => `<div class="grid-cell weekday">${d}</div>`).join('');
    
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const prevMonthDays = new Date(year, month, 0).getDate();
    
                for (let i = firstDay - 1; i >= 0; i--) {
                    const day = prevMonthDays - i;
                    calendarGrid.innerHTML += `<div class="grid-cell other-month">${day}</div>`;
                }
    
                for (let day = 1; day <= daysInMonth; day++) {
                    const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                    const hasEvent = hasEvents(year, month, day);
                    calendarGrid.innerHTML += `<div class="grid-cell ${isToday ? 'current-day' : ''} ${hasEvent ? 'has-events' : ''}">${day}</div>`;
                }
    
                const totalCells = firstDay + daysInMonth;
                const nextMonthDays = 35 - totalCells > 0 ? 35 - totalCells : 42 - totalCells;
                for (let day = 1; day <= nextMonthDays; day++) {
                    calendarGrid.innerHTML += `<div class="grid-cell other-month">${day}</div>`;
                }
            } catch(e) {}
        };
    
        window.addEventListener('storage', (event) => {
            if (event.key === 'events') renderMonth();
            if (event.key === 'theme') document.body.classList.toggle('light-theme', event.newValue === 'light');
        });
    
        renderMonth();
    });
    </script>
</body>
</html>
