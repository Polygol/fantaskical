<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../lang.js">
        // --- Internationalization (i18n) Support ---
        function getAppLanguage() {
            let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
            if (l === 'JA') l = 'JP';
            return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
        }

        function t(key, params = {}) {
            const lang = getAppLanguage();
            const dict = window['LANG_' + lang + '_FANTASKICAL'] || window['LANG_EN_FANTASKICAL'] || {};
            let str = dict[key] || key;
            Object.keys(params).forEach(p => {
                str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]);
            });
            return str;
        }

        function applyLanguage(langCode) {
            if (langCode) localStorage.setItem('language', langCode);
            const lang = getAppLanguage();
            const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
            document.documentElement.lang = bcpMap[lang] || 'en-US';
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const k = el.getAttribute('data-lang-key');
                if (k) {
                    if (el.tagName === 'TITLE') {
                        document.title = t(k);
                    } else {
                        el.textContent = t(k);
                    }
                }
            });
            document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
                const k = el.getAttribute('data-lang-placeholder');
                if (k) el.placeholder = t(k);
            });
            document.querySelectorAll('[data-lang-title]').forEach(el => {
                const k = el.getAttribute('data-lang-title');
                if (k) el.title = t(k);
            });
            if (typeof onLanguageChanged === 'function') {
                onLanguageChanged(lang);
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
                applyLanguage(e.data.languageCode);
            }
        });

        window.addEventListener('DOMContentLoaded', () => applyLanguage());
        

    </script>
    <title>Recent Tasks</title>
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js"></script>
    <style>
        :root {
            --text-color: #f9f9f9;
            --secondary-text-color: rgba(255, 255, 255, 0.7);
        }
        body.light-theme {
            --text-color: #333333;
            --secondary-text-color: rgba(0, 0, 0, 0.7);
        }
        body {
            background: transparent; font-family: 'Inter', sans-serif;
            color: var(--text-color); margin: 0; padding: 20px;
            height: 100vh; box-sizing: border-box; overflow: hidden;
        }
        .header {
            font-weight: bold; font-size: 18px; margin-bottom: 10px;
        }
        .task-list {
            font-size: 18px;
            line-height: 31px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-item {
            display: flex; align-items: center;
            margin-bottom: 4px;
        }
        .task-bullet {
            margin-right: 8px;
        }
        .task-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .no-tasks { color: var(--secondary-text-color); }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="header" id="widgetHeader"></div>
        <div class="task-list" id="taskList">Loading...</div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskList = document.getElementById('taskList');
            const widgetHeader = document.getElementById('widgetHeader');
        
            function updateTasks() {
                try {
                    const allTasks = JSON.parse(localStorage.getItem('tasks')) || [];
                    const allActiveTasks = allTasks.filter(task => !task.completed);
                    
                    // Update header with the total count of active tasks
                    const activeCount = allActiveTasks.length;
                    widgetHeader.textContent = `${activeCount} active ${activeCount === 1 ? 'task' : 'tasks'}`;
        
                    // Get the 4 most recent tasks to display in the list
                    const tasksToDisplay = allActiveTasks
                        .sort((a, b) => b.id - a.id)
                        .slice(0, 4);
        
                    if (tasksToDisplay.length === 0) {
                        taskList.innerHTML = '<div class="no-tasks">All tasks complete</div>';
                    } else {
                        taskList.innerHTML = tasksToDisplay.map(task => `
                            <div class="task-item">
                                <span class="task-bullet">•</span>
                                <div class="task-text">${task.text}</div>
                            </div>
                        `).join('');
                    }
                } catch(e) {
                    taskList.innerHTML = '<div class="no-tasks">Error</div>';
                    widgetHeader.textContent = 'Active Tasks';
                }
            }
        
            window.addEventListener('storage', (event) => {
                if (event.key === 'tasks') {
                    updateTasks();
                }
                if (event.key === 'theme') {
                    document.body.classList.toggle('light-theme', event.newValue === 'light');
                }
            });
        
            updateTasks();
        });
    </script>
</body>
</html>
