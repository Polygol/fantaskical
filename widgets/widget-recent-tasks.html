<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../lang.js"></script>
    <script>
        function getAppLanguage() {
            let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
            if (l === 'JA') l = 'JP';
            return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
        }

        function t(key, params = {}) {
            const lang = getAppLanguage();
            const dict = window['LANG_' + lang + '_FANTASKICAL'] || window['LANG_EN_FANTASKICAL'] || {};
            let str = dict[key] || key;
            Object.keys(params).forEach(p => str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]));
            return str;
        }

        function applyLanguage(langCode) {
            if (langCode) localStorage.setItem('language', langCode);
            const lang = getAppLanguage();
            const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
            document.documentElement.lang = bcpMap[lang] || 'en-US';
            if (typeof updateTasks === 'function') updateTasks();
        }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
                applyLanguage(e.data.languageCode);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'language' || e.key === 'selectedLanguage') {
                applyLanguage(e.newValue);
            }
        });

        window.addEventListener('DOMContentLoaded', () => applyLanguage());
    </script>
    <title>Recent Tasks</title>
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js"></script>
    <style>
        :root {
            --text-color: #f9f9f9;
            --secondary-text-color: rgba(255, 255, 255, 0.7);
        }
        body.light-theme {
            --text-color: #333333;
            --secondary-text-color: rgba(0, 0, 0, 0.7);
        }
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .widget-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            font-weight: bold; font-size: 18px; margin-bottom: 10px;
        }
        .task-list {
            font-size: 18px;
            line-height: 31px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-item {
            display: flex; align-items: center;
            margin-bottom: 4px;
        }
        .task-bullet {
            margin-right: 8px;
        }
        .task-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .no-tasks { color: var(--secondary-text-color); }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="header" id="widgetHeader"></div>
        <div class="task-list" id="taskList"></div>
    </div>
    <script>
        let updateTasks;
        document.addEventListener('DOMContentLoaded', () => {
            const taskList = document.getElementById('taskList');
            const widgetHeader = document.getElementById('widgetHeader');
        
            updateTasks = function() {
                try {
                    const allTasks = JSON.parse(localStorage.getItem('tasks')) || [];
                    const allActiveTasks = allTasks.filter(task => !task.completed);
                    const activeCount = allActiveTasks.length;
                    
                    widgetHeader.textContent = t('ACTIVE_TASKS_COUNT', {count: activeCount}) || `${activeCount} active tasks`;
        
                    const tasksToDisplay = allActiveTasks
                        .sort((a, b) => b.id - a.id)
                        .slice(0, 4);
        
                    if (tasksToDisplay.length === 0) {
                        taskList.innerHTML = `<div class="no-tasks">${t('ALL_TASKS_COMPLETE')}</div>`;
                    } else {
                        taskList.innerHTML = tasksToDisplay.map(task => `
                            <div class="task-item">
                                <span class="task-bullet">•</span>
                                <div class="task-text">${task.text}</div>
                            </div>
                        `).join('');
                    }
                } catch(e) {
                    taskList.innerHTML = `<div class="no-tasks">${t('LOADING')}</div>`;
                    widgetHeader.textContent = t('ACTIVE_TASKS');
                }
            };
        
            window.addEventListener('storage', (event) => {
                if (event.key === 'tasks') updateTasks();
                if (event.key === 'theme') document.body.classList.toggle('light-theme', event.newValue === 'light');
            });
        
            updateTasks();
        });
    </script>
</body>
</html>
